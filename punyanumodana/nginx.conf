server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable ETags for conditional validation (304 Not Modified)
    etag on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Root fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # HTML and JSON:
    # Must revalidate so template additions and HTML changes appear immediately
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # JavaScript and CSS:
    # Not hashed with a build digest (app.js, style.css). Revalidate with ETag
    # so updates take effect immediately without requiring manual Cloudflare cache purging.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # Static media & templates (PNGs, images, fonts, icons):
    # Validates ETag on every request (max-age=0, must-revalidate):
    # - If file unchanged: returns 304 Not Modified (instant, 0 bytes download)
    # - If file changed: immediately downloads updated image without query params or manual purges
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }
}
